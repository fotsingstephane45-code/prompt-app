services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
